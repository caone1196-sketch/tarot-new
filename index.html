<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensual Tarot — Gallery</title>
<style>
  :root{ --gold:#c9a227; --gold-dim:#8a6f1e; --ink:#0b0a0f; --panel:#14121b; }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#1d1726 0%,var(--ink) 60%);
       color:#e8e2d4;font-family:"Iowan Old Style",Georgia,"Times New Roman",serif}
  header{text-align:center;padding:44px 20px 26px;position:relative}
  header::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;
       width:min(560px,80%);height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
  h1{margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:.14em;text-transform:uppercase;
     color:var(--gold);text-shadow:0 2px 18px rgba(201,162,39,.25)}
  .sub{margin:12px 0 0;color:#9b9284;letter-spacing:.28em;font-size:12px;text-transform:uppercase}
  .count{margin:18px 0 0;color:#b9ae97;font-size:14px}
  .bar{width:min(320px,70%);height:6px;margin:14px auto 0;border:1px solid #3a3350;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
  .cards{display:grid;gap:34px;padding:46px 24px 70px;justify-content:center;
         grid-template-columns:repeat(auto-fill,minmax(260px,1fr));max-width:1240px;margin:0 auto}
  figure{margin:0;text-align:center}
  .frame{border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px #2c2740;
         background:#000;transition:transform .28s ease,box-shadow .28s ease;cursor:zoom-in}
  .frame:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 26px 64px rgba(0,0,0,.8),0 0 0 1px var(--gold-dim)}
  img{display:block;width:100%;height:auto}
  figcaption{margin-top:14px}
  .en{color:var(--gold);letter-spacing:.16em;font-size:12px;text-transform:uppercase}
  .vn{color:#cfc6b4;font-size:15px;margin-top:4px}
  .meta{color:#7d7466;font-size:11px;margin-top:6px;letter-spacing:.06em}
  .scene{color:#8d8574;font-size:12px;max-width:34ch;margin:8px auto 0;line-height:1.5;font-style:italic}
  .dl{display:inline-block;margin-top:8px;color:#6f8fbf;font-size:11px;text-decoration:none;letter-spacing:.08em}
  .dl:hover{text-decoration:underline}
  .empty{text-align:center;color:#6b6455;padding:60px;font-style:italic}
  /* lightbox */
  #lb{position:fixed;inset:0;background:rgba(6,5,9,.94);display:none;place-items:center;z-index:50;padding:24px}
  #lb.on{display:grid}
  #lb img{max-height:88vh;max-width:min(92vw,620px);border-radius:8px;box-shadow:0 0 80px rgba(0,0,0,.9)}
  #lb .cap{margin-top:14px;text-align:center;color:var(--gold);letter-spacing:.2em;font-size:13px;text-transform:uppercase}
  #lb .hint{text-align:center;color:#6b6455;font-size:11px;margin-top:6px}
  footer{text-align:center;color:#5c5548;font-size:11px;padding:0 20px 50px;letter-spacing:.1em}
</style>
</head>
<body>
<header>
  <h1>Sensual Tarot</h1>
  <p class="sub">Full-bleed · v5 · 78 lá</p>
  <p class="count"><span id="n">0</span> / 78 lá đã hoàn thành</p>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
</header>
<main class="cards" id="grid"></main>
<footer id="foot"></footer>

<div id="lb"><div>
  <img id="lbimg" alt=""><div class="cap" id="lbcap"></div>
  <div class="hint">click / ESC để đóng</div>
</div></div>

<script>
const DATA = {"cards": [{"slug": "00-fool", "file": "cards/00-fool.png", "title": "Kẻ Ngây Thơ", "title_en": "THE FOOL", "title_vn": "Kẻ Ngây Thơ", "width": 784, "height": 1360, "scene": "a carefree 19-year-old woman wanderer draped only in a transparent silk veil so fine it clings and reveals her bare body beneath, the veil slipping from one shoulder and streaming behind her, a white rose lifted in one hand and her eyes lowered to look at it, stepping lightly toward a cliff edge, a small white dog leaping at her heel, distant mountains under a golden morning sun", "prompt": "cards/prompts/00-fool.txt"}, {"slug": "01-magician", "file": "cards/01-magician.png", "title": "Pháp Sư", "title_en": "THE MAGICIAN", "title_vn": "Pháp Sư", "width": 784, "height": 1360, "scene": "a nude young woman magician, bare torso with a length of silk slung low across her hips, one hand raising a wand to the sky and the other pointing down to the earth, the altar table before her laid with a cup, a sword, a wand and a pentacle, a garden of black roses behind her", "prompt": "cards/prompts/01-magician.txt"}, {"slug": "02-priestess", "file": "cards/02-priestess.png", "title": "Nữ Tư Tế", "title_en": "THE HIGH PRIESTESS", "title_vn": "Nữ Tư Tế", "width": 784, "height": 1360, "scene": "a serene nude priestess, bare shoulders and the soft line of her breasts veiled only by a drift of sheer gauze, seated between two stone pillars, a scroll of mystery resting in her lap, a silver crescent moon at her feet", "prompt": "cards/prompts/02-priestess.txt"}, {"slug": "03-empress", "file": "cards/03-empress.png", "title": "Nữ Hoàng", "title_en": "THE EMPRESS", "title_vn": "Nữ Hoàng", "width": 784, "height": 1360, "scene": "a slender nude empress, one breast bared, a crown of flowers in loosened hair, reclining on a velvet throne amid ripe golden wheat and fruits, a heart-shaped shield of Venus leaning beside her", "prompt": "cards/prompts/03-empress.txt"}, {"slug": "04-emperor", "file": "cards/04-emperor.png", "title": "Hoàng Đế", "title_en": "THE EMPEROR", "title_vn": "Hoàng Đế", "width": 784, "height": 1360, "scene": "a serene 25-year-old female emperor reclining gracefully on a stone throne carved with ram heads, draped only in a diaphanous transparent silk veil so fine it clings to her soft curves and glows with warm light against her skin, the gossamer fabric slipping from one shoulder, holding an ankh scepter loosely in one hand, barren rugged mountains behind her", "prompt": "cards/prompts/04-emperor.txt"}, {"slug": "05-hierophant", "file": "cards/05-hierophant.png", "title": "Giáo Hoàng", "title_en": "THE HIEROPHANT", "title_vn": "Giáo Hoàng", "width": 784, "height": 1360, "scene": "a serene 24-year-old female high mystic priestess draped only in a diaphanous transparent red silk veil so fine it clings to her curves and glows with warm candlelight against her skin, the gossamer-thin fabric slipping from one shoulder, raising one blessing hand, two fair-skinned kneeling female acolytes before her, sacred temple pillars behind", "prompt": "cards/prompts/05-hierophant.txt"}, {"slug": "06-lovers", "file": "cards/06-lovers.png", "title": "Tình Nhân", "title_en": "THE LOVERS", "title_vn": "Tình Nhân", "width": 784, "height": 1360, "scene": "a fair-skinned nude young man and a nude young woman standing hand in hand beneath a great winged angel, her body turned three-quarters toward the viewer with silk fallen to her hip and his hand at the small of her back, the tree of knowledge with a serpent behind her, the tree of flames behind him", "prompt": "cards/prompts/06-lovers.txt"}, {"slug": "07-chariot", "file": "cards/07-chariot.png", "title": "Chiến Xa", "title_en": "THE CHARIOT", "title_vn": "Chiến Xa", "width": 784, "height": 1360, "scene": "a heroic bare-shouldered woman charioteer wrapped in loose sheer white silk with no armor, standing tall in a stone chariot between two sphinxes under a starry canopy, a walled city behind her", "prompt": "cards/prompts/07-chariot.txt"}], "total": 78, "generated": "2026-09-07 16:50 UTC"};
const grid = document.getElementById('grid');
const pct = Math.round(DATA.cards.length / DATA.total * 100);
document.getElementById('n').textContent = DATA.cards.length;
document.getElementById('bar').style.width = pct + '%';
document.getElementById('foot').textContent =
  'Sinh ' + DATA.generated + ' · prompt nguồn: prompts-full.json · tỉ lệ 7:12 full-bleed';

if (!DATA.cards.length) {
  grid.innerHTML = '<p class="empty">Chưa có lá nào. Chạy: python 04-AI-GUIDE/build-gallery.py</p>';
}
for (const c of DATA.cards) {
  const f = document.createElement('figure');
  const size = c.width ? c.width + '×' + c.height : '';
  const src = c.file + '?v=' + encodeURIComponent(DATA.generated);
  f.innerHTML =
    '<div class="frame"><img loading="lazy" src="' + src + '" alt="' + c.title_en + '"></div>' +
    '<figcaption>' +
      '<div class="en">' + c.title_en + '</div>' +
      '<div class="vn">' + c.title_vn + '</div>' +
      '<div class="meta">' + c.slug + (size ? ' · ' + size : '') + '</div>' +
      (c.scene ? '<div class="scene">' + c.scene.slice(0, 150) + (c.scene.length > 150 ? '…' : '') + '</div>' : '') +
      (c.prompt ? '<a class="dl" href="' + c.prompt + '" download>prompt đã dùng ↓</a>' : '') +
    '</figcaption>';
  f.querySelector('.frame').onclick = () => open(c);
  grid.appendChild(f);
}

const lb = document.getElementById('lb');
function open(c){
  document.getElementById('lbimg').src = c.file + '?v=' + encodeURIComponent(DATA.generated);
  document.getElementById('lbcap').textContent = c.title_en + ' — ' + c.title_vn;
  lb.classList.add('on');
}
lb.onclick = () => lb.classList.remove('on');
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('on'); });
</script>
</body>
</html>
